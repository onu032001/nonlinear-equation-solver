<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이원연립방정식 풀이기</title>
  <style>
    :root {
      --gradient: linear-gradient(120deg, rgba(53, 146, 222, 1) 0%, rgba(165, 44, 199, 1) 50%, rgba(201, 20, 20, 1) 100%);
    }
    body {
      min-width: 100vw;
      min-height: 100vh;
      background: var(--gradient);
      background-repeat: repeat;
      color: white;
      font-family: 'Noto Sans KR', 'NanumGothic', sans-serif;
    }
    .inputContainer {
      display: inline-block;
      padding: 0;
      width: fit-content;
      height: fit-content;
    }
    .inputContainer input {
      font-family: monospace;
      margin: 0;
      width: 300px;
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathquill/build/mathquill.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathquill/build/mathquill.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/evaluatex/dist/evaluatex.min.js"></script>
  <script src="https://onu032001.github.io/nonlinear-equation-solver/solver.js"></script>
</head>
<body>
  <div>
    <h1>이원연립방정식 풀이기</h1>
    <p>평범한학생_7 제작</p>
  </div>
  <hr>
  <div>
    <h1>입력</h1>
    <label for="func1">방정식 1 (x와 y에 대한 식으로): </label>
    <span id="func1"></span> = <span id="func2"></span><br>
    <label for="func2">방정식 2 (x와 y에 대한 식으로): </label>
    <span id="func3"></span> = <span id="func4"></span><br>
    <button id="solveEquation"><span id="cond">-100 \leq x \leq 100, -100 \leq y \leq 100</span> 내에서 풀이</button>
  </div>
  <div>
    <h1>결과</h1>
    <p id="solveResult">풀이 버튼을 눌러 풀이를 시작하세요.</p>
  </div>
  <script>
    const solver2 = new SystemSolver2();
    
    const func1Input = document.getElementById('func1');
    const func2Input = document.getElementById('func2');
    const func3Input = document.getElementById('func3');
    const func4Input = document.getElementById('func4');

    let MQ2 = MathQuill.getInterface(2);
    const mathFields = [func1Input, func2Input, func3Input, func4Input].map(function(element) {
      return MQ2.MathField(element, {
        restrictMismatchedBrackets: true
      });
    });

    const condElement = document.getElementById('cond');
    MQ2.StaticMath(condElement);
    
    const solveEqnButton = document.getElementById('solveEquation');
    const solveResult = document.getElementById('solveResult');

    function solveEquation() {
      const exprs = mathFields.map(function(field) {
        return field.latex();
      });
      try {
        const result = solver2.solve([
          (x, y) => evaluatex(exprs[0])({x, y}) - evaluatex(exprs[1])({x, y}),
          (x, y) => evaluatex(exprs[2])({x, y}) - evaluatex(exprs[3])({x, y})
        ], [[-100, 100], [-100, 100]], 10, 1e-6);
        solveResult.innerHTML = `
          <math>
            <mrow>
              <mo>{</mo>
              <mtable>
                <mtr><mtd>
                  <mrow>
                    <mi>x</mi>
                    <mo>=</mo>
                    <mn>${result[0]}</mn>
                  </mrow>
                </mtd></mtr>
                <mtr><mtd>
                  <mrow>
                    <mi>y</mi>
                    <mo>=</mo>
                    <mn>${result[1]}</mn>
                  </mrow>
                </mtd></mtr>
              </mtable>
              <mo></mo>
            </mrow>
          </math>
        `;
      } catch (error) {
        solveResult.innerHTML = "이원연립방정식을 풀 수 없습니다.";
      }
    }

    solveEqnButton.addEventListener('click', solveEquation);
  </script>
</body>
</html>
